# =============================================================================
# MangosSuperUI + SuperUI-Core Docker Compose Stack
# =============================================================================
# Usage:
#   1. Copy .env.example to .env and edit
#   2. ./scripts/download-artifacts.ps1     # pre-cache binaries on host
#   3. docker compose build                 # assemble images
#   4. docker compose up -d mariadb         # start DB first
#   5. ./scripts/init-database.sh --bare    # or --standard / --full
#   6. docker compose up -d                 # start everything
#   7. Open http://localhost:5000
#
# Optional AI services (Ollama, ComfyUI) are gated behind the "ai" profile:
#   docker compose --profile ai up -d
# =============================================================================

name: mangossuperui

services:
  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:${MARIADB_VERSION:-10.11}
    container_name: mangos-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-mangos}
      MARIADB_USER: ${MARIADB_USER:-mangos}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-mangos}
      TZ: ${TZ:-UTC}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=1G
      - --innodb-buffer-pool-size=512M
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - superui-net

  # ---------------------------------------------------------------------------
  # Mangosd + realmd (world + auth servers) - SuperUI-Core
  # Both processes run inside the same container by design - they share the
  # same binary directory, same /data volume, and the same DB connection pool.
  # (This matches the upstream VMaNGOS docs where both are run side by side.)
  # ---------------------------------------------------------------------------
  mangosd:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      args:
        SUPERUI_CORE_VERSION: ${SUPERUI_CORE_VERSION:-latest}
    image: mangossuperui/core:${SUPERUI_CORE_VERSION:-latest}
    container_name: mangos-world-server
    restart: unless-stopped
    tty: true
    stdin_open: true
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: ${MARIADB_USER:-mangos}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-mangos}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-mangos}
      RA_IP: ${RA_IP:-0.0.0.0}
      RA_PORT: ${MANGOSD_RA_PORT:-3443}
      RA_MIN_LEVEL: ${RA_MIN_LEVEL:-3}
      SUPERUI_CORE_VERSION: ${SUPERUI_CORE_VERSION:-latest}
    # RA port is exposed only to the host's localhost - never publicly
    ports:
      - "127.0.0.1:${MANGOSD_RA_PORT:-3443}:3443"
    volumes:
      - core-data:/opt/superui-core/data
      - core-logs:/opt/superui-core/logs
      - core-run:/opt/superui-core/run
      # The etc directory holds mangosd.conf and realmd.conf. It's shared with
      # the superui container so the UI's Config Editor can read/write the
      # server configs. The mangosd entrypoint seeds mangosd.conf from the
      # bundled .dist template on first run.
      - core-etc:/opt/superui-core/etc
      # Optional: mount the WoW 1.12.1 client Data/ directory to expose DBC, maps,
      # vmaps, mmaps. The entrypoint symlinks them into the server's data/ dir.
      - ${WOW_CLIENT_DATA:-/dev/null}:/data:ro
    cap_add:
      - SYS_NICE  # higher process priority for smoother combat. Drop if it fails.
    security_opt:
      - no-new-privileges:true
    networks:
      - superui-net

  # ---------------------------------------------------------------------------
  # MangosSuperUI web UI
  # ---------------------------------------------------------------------------
  superui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
      args:
        MANGOS_SUPER_UI_VERSION: ${MANGOS_SUPER_UI_VERSION:-v1.2}
    image: mangossuperui/ui:${MANGOS_SUPER_UI_VERSION:-v1.2}
    container_name: mangossuperui-web
    restart: unless-stopped
    # Share the mangosd container's PID namespace so /proc inside the UI sees
    # the actual mangosd-main / realmd-main processes. Without this, the UI's
    # process-status checks always show "Offline" because they look up
    # /proc/<pid>/comm in their own (empty) PID namespace.
    pid: "service:mangosd"
    depends_on:
      mariadb:
        condition: service_healthy
      mangosd:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:${UI_HTTP_PORT:-5000}
      ASPNETCORE_ENVIRONMENT: Production
      TZ: ${TZ:-UTC}
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: ${MARIADB_USER:-mangos}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-mangos}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-mangos}
      MANGOS_ADMIN_DB: ${MANGOS_ADMIN_DB:-vmangos_admin}
      RA_HOST: mangosd
      RA_PORT: ${MANGOSD_RA_PORT:-3443}
      RA_USERNAME: ${RA_USERNAME:-superui}
      RA_PASSWORD: ${RA_PASSWORD:-Changeme123!}
      RA_MIN_LEVEL: ${RA_MIN_LEVEL:-3}
      MANGOSD_PROCESS_NAME: mangosd-main
      REALMD_PROCESS_NAME: realmd-main
      CLIENT_DATA_PATH: /data/Data
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      COMFYUI_HOST: ${COMFYUI_HOST:-}
      MANGOS_SUPER_UI_VERSION: ${MANGOS_SUPER_UI_VERSION:-v1.2}
    ports:
      - "${UI_HTTP_PORT:-5000}:${UI_HTTP_PORT:-5000}"
    volumes:
      - ui-data:/opt/mangossuperui/data
      - ui-cache:/opt/mangossuperui/wwwroot/cache
      - ui-patches:/opt/mangossuperui/wwwroot/patches
      # Shared with mangosd so the UI can verify process status, read/write
      # configs, and serve DBC/maps/vmaps/icons on demand from the same
      # volumes mangosd uses.
      - core-etc:/opt/superui-core/etc:ro
      - core-bin:/opt/superui-core/bin:ro
      - core-data:/opt/superui-core/data:ro
      - core-logs:/opt/superui-core/logs:ro
      # WoW 1.12.1 client Data/ directory (mounted read-only). The UI serves
      # icons, 3D models, and minimap tiles directly from the MPQs.
      - ${WOW_CLIENT_DATA:-/dev/null}:/data:ro
      - ./backups:/var/mangossuperui/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - superui-net

  # ---------------------------------------------------------------------------
  # One-shot: VMaps/DBC/Maps extractor. Runs the SuperUI-Core bundled Extractors
  # against the mounted WoW client and writes output to the core-data volume.
  # Profile "extract" so it never auto-starts. Use:
  #   docker compose --profile extract up vmaps-extract
  # No healthcheck, no auto-restart - it's a one-shot job.
  # ---------------------------------------------------------------------------
  vmaps-extract:
    image: mangossuperui/core:latest
    container_name: mangos-vmaps-extract
    profiles: ["extract"]
    restart: "no"
    healthcheck:
      test: ["CMD", "true"]
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      WOW_CLIENT_DATA: ${WOW_CLIENT_DATA:-}
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
    volumes:
      - core-data:/opt/superui-core/data
      - core-logs:/opt/superui-core/logs
      - ${WOW_CLIENT_DATA:-/dev/null}:/data:ro
    working_dir: /opt/superui-core/data
    entrypoint: ["/usr/local/bin/extract-client-data.sh"]
    networks:
      - superui-net

  # ---------------------------------------------------------------------------
  # One-shot: apply all SQL migrations to bring the world DB up to the fork's
  # current schema. Uses --binary-mode + --delimiter for the add_migration()
  # stored procedures that use `delimiter ??` syntax.
  # Profile "migrate" so it never auto-starts. Use:
  #   docker compose --profile migrate up migrations-apply
  # ---------------------------------------------------------------------------
  migrations-apply:
    image: mangossuperui/core:latest
    container_name: mangos-migrations-apply
    profiles: ["migrate"]
    restart: "no"
    healthcheck:
      test: ["CMD", "true"]
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: root
      MARIADB_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    volumes:
      - core-data:/opt/superui-core/data
    working_dir: /opt/superui-core/data
    entrypoint: ["/usr/local/bin/apply-migrations.sh"]
    networks:
      - superui-net

  # ---------------------------------------------------------------------------
  # Optional: Ollama (LLM for bot chat + spell creator prompts)
  # Disabled by default. Enable with --profile ai.
  # The image does NOT download anything at build time.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: mangos-ollama
    restart: unless-stopped
    profiles: ["ai"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ollama-data:/root/.ollama
    # On Windows / macOS, host.docker.internal reaches the host. On Linux,
    # add `extra_hosts: ["host.docker.internal:host-gateway"]` if needed.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - superui-net

  ollama-puller:
    image: curlimages/curl:latest
    container_name: mangos-ollama-puller
    profiles: ["ai"]
    depends_on:
      - ollama
    networks:
      - superui-net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to be reachable..."
        for i in $$(seq 1 60); do
          if curl -fsS http://ollama:11434/api/tags >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        echo "Pulling model ${OLLAMA_MODEL:-qwen3:4b} (this is on-demand; not at build time)..."
        curl -fsS -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"${OLLAMA_MODEL:-qwen3:4b}\"}" || echo "model pull failed; you can retry manually"
        echo "Done."

  # ---------------------------------------------------------------------------
  # Optional: ComfyUI (image generation for spell creator / item retexture)
  # Disabled by default. Enable with --profile ai.
  # The image is NOT downloaded at build time - it's pulled at docker compose up.
  # ---------------------------------------------------------------------------
  comfyui:
    image: yanwk/comfyui-boot:latest
    container_name: mangos-comfyui
    restart: unless-stopped
    profiles: ["ai"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - comfyui-data:/root/ComfyUI
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - superui-net

networks:
  superui-net:
    driver: bridge

volumes:
  mariadb-data:
  core-data:
  core-logs:
  core-run:
  core-bin:
  core-etc:
  ui-data:
  ui-cache:
  ui-patches:
  ollama-data:
  comfyui-data:

  # ---------------------------------------------------------------------------
  # One-shot: Apply migrations (foreground, no daemon needed since it runs once)
  # Use: docker compose --profile migrate up migrations-apply
  # The script is robust enough that the bash tool's 30-min timeout covers it.
  # ---------------------------------------------------------------------------
  # (Already added above as migrations-apply profile)
